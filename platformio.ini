[env]
platform = espressif32
framework = arduino
monitor_speed = 9600
lib_deps = 
    mathieucarbou/ESPAsyncWebServer@3.1.0
    ipdotsetaf/ESPAsyncHTTPUpdateServer@^2.0.0
    okalachev/MAVLink@^2.0.11
    bblanchon/ArduinoJson@^7.3.0
    arkhipenko/TaskScheduler@^3.8.5
build_flags = -Wno-address-of-packed-member

[env:esp32_c3_devkit]
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDRIFT_MAVLINK_UART0

; End-to-end test build (test/e2e/docker). Espressif's QEMU fork
; emulates neither the WiFi nor the BLE radio, so DRIFT_NO_NET and DRIFT_NO_BLE
; switch src/net.cpp and src/ble.cpp to no-op implementations. What remains is
; the serial-driven MAVLink -> DRI -> status path. The QEMU machine exposes both
; UARTs as chardevs: STDOUT stays on Serial/UART0 and DRIFT_MAVLINK_UART1 moves
; the telemetry input to Serial1/UART1, so the two streams stay separable.
; DIO flash mode: QEMU's m25p80 model mishandles the dummy bytes of the QIO
; fast-read command, so every esp_flash_read() returns two junk bytes ahead of
; the data - NVS reads garbage and config storage silently stays empty. DIO
; reads are emulated correctly, so the e2e build boots with working NVS
; (pre-seeded with the reference aircraft, see test/e2e/nvs_seed.py).
[env:esp32_c3_e2e]
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
board_build.flash_mode = dio
build_flags =
    ${env.build_flags}
    -DDRIFT_NO_NET
    -DDRIFT_NO_BLE
    -DDRIFT_MAVLINK_UART1

; Host-side unit test environment (pio test -e native).
; ESP/hardware-specific sources are excluded; Arduino APIs come from ArduinoFake.
[env:native]
platform = native
framework =
build_flags =
    ${env.build_flags}
    -std=gnu++11
    -DARDUINO=10805
    -DUNITY_INCLUDE_DOUBLE
    ; Apple clang 21+ rejects ArduinoFake's fakeit.hpp with this error (it is
    ; an error by default there, a warning on GCC/Clang Linux).
    -Wno-missing-template-arg-list-after-template-kw
lib_deps =
    okalachev/MAVLink@^2.0.11
    bblanchon/ArduinoJson@^7.3.0
    fabiobatsilva/ArduinoFake@^0.4.0
build_src_filter =
    +<*.cpp>
    -<main.cpp>
    -<dash.cpp>
    -<config_storage_esp.cpp>
test_build_project_src = yes
test_ignore = fixtures, tools, support
