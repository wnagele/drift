name: Build PR

on:
  pull_request:
    paths-ignore:
      - 'site/**'

permissions:
  contents: read
  id-token: write

jobs:
  fixtures-fresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Fixtures match their generators
        run: |
          make fixtures
          git diff --exit-code -- test/fixtures

  firmware-test:
    needs: fixtures-fresh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Native Unit Tests
        run: pio test -e native

  firmware-e2e:
    needs: firmware-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build E2E Firmware
        run: pio run -e esp32_c3_e2e
      - name: Build E2E Image
        run: docker build -f test/e2e/docker/Dockerfile -t drift-e2e test/e2e/docker
      - name: E2E Tests
        run: docker run --rm -v "$PWD:/work:ro" drift-e2e

  dash-test:
    needs: fixtures-fresh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dependencies
        run: npm ci
        working-directory: dash
      - name: Unit Tests
        run: npm test
        working-directory: dash

  dash-e2e:
    needs: dash-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dependencies
        run: npm ci
        working-directory: dash
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: dash
      - name: E2E Tests
        run: npm run test:e2e
        working-directory: dash

  build:
    needs: [dash-e2e, firmware-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Debug Info
        env:
          DEBUG_GIT_REF: ${{ github.sha }}
        run: |
          sed -i "1s/^/#define DEBUG_GIT_REF \"${DEBUG_GIT_REF}\"\n/" src/debug.h
          sed -i "1s/^/#define DEBUG_BUILD_TIME \"$(date -Iseconds)\"\n/" src/debug.h
          grep '^#define DEBUG_' src/debug.h
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Install esptool
        run: pip install --upgrade esptool
      - name: Build
        run: pio run -e esp32_c3_devkit
      - name: Package
        run: |
          mkdir .pio/package
          esptool.py --chip esp32c3 \
                     merge_bin \
                     -o .pio/package/firmware-esp32_c3_devkit-${{ github.sha }}-full.bin \
                     0x0000 .pio/build/esp32_c3_devkit/bootloader.bin \
                     0x8000 .pio/build/esp32_c3_devkit/partitions.bin \
                     0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
                     0x10000 .pio/build/esp32_c3_devkit/firmware.bin
          cp .pio/build/esp32_c3_devkit/firmware.bin .pio/package/firmware-esp32_c3_devkit-${{ github.sha }}-ota.bin
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/package/*.bin
